name: Copy Docker Image
run-name: Copy ${{ inputs.source_repo }} to ${{ inputs.destination_repo }}
on: 
  workflow_dispatch:
    inputs:
      source:
        description: '镜像源 (Registry)'     
        required: true
        default: 'docker.io'
      destination:
        description: '目标源 (Registry)'
        required: true
        default: 'registry.cn-hangzhou.aliyuncs.com'
      source_repo:
        description: '仓库及标签 (格式 repo:tag)'
        required: true
        default: ''
      destination_repo:
        description: '目标仓库及标签 (格式 repo:tag)'
        required: true
        default: ''

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
    - name: Copy Docker Images
      run: |
        # 使用 skopeo 复制镜像，强制使用 v2s2 格式以兼容阿里云 ACR
        
        # 构建源认证参数（如果密钥为空则不添加）
        SRC_CREDS=""
        if [ -n "${{ secrets.SOURCE_CREDENTIAL }}" ]; then
          SRC_CREDS="--src-creds=${{ secrets.SOURCE_CREDENTIAL }}"
        fi
        
        # 执行复制
        # --format v2s2: 转换为 Docker v2 schema 2 格式（阿里云 ACR 支持）
        # --all: 复制所有架构
        # --preserve-digests=false: 不保留原始 digest，允许重新计算
        # --multi-arch=all: 复制多架构镜像的所有平台
        skopeo copy \
          $SRC_CREDS \
          --dest-creds="${{ secrets.DESTINATION_CREDENTIAL }}" \
          --format v2s2 \
          --all \
          --preserve-digests=false \
          --remove-signatures \
          docker://${{ github.event.inputs.source }}/${{ github.event.inputs.source_repo }} \
          docker://${{ github.event.inputs.destination }}/${{ github.event.inputs.destination_repo }}
