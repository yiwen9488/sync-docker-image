name: Copy Docker Image
run-name: Copy ${{ inputs.source_repo }} to ${{ inputs.destination_repo }}
on: 
  workflow_dispatch:
    inputs:
      source:
        description: '镜像源 (Registry)'     
        required: true
        default: 'docker.io'
      destination:
        description: '目标源 (Registry)'
        required: true
        default: 'registry.cn-hangzhou.aliyuncs.com'
      source_repo:
        description: '仓库及标签 (格式 repo:tag)'
        required: true
        default: ''
      destination_repo:
        description: '目标仓库及标签 (格式 repo:tag)'
        required: true
        default: ''

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
    - name: Copy Docker Images
      run: |
        echo "开始复制镜像..."
        
        # 只登录目标仓库（源仓库为公开仓库）
        DEST_USER=$(echo "${{ secrets.DESTINATION_CREDENTIAL }}" | cut -d: -f1)
        DEST_PASS=$(echo "${{ secrets.DESTINATION_CREDENTIAL }}" | cut -d: -f2-)
        echo "$DEST_PASS" | docker login ${{ github.event.inputs.destination }} -u "$DEST_USER" --password-stdin
        
        # 使用 docker buildx imagetools create 复制镜像（自动处理多架构）
        docker buildx imagetools create \
          --tag ${{ github.event.inputs.destination }}/${{ github.event.inputs.destination_repo }} \
          ${{ github.event.inputs.source }}/${{ github.event.inputs.source_repo }}
