name: Copy Docker Image
run-name: Copy ${{ inputs.source_repo }} to ${{ inputs.destination_repo }}
on: 
  workflow_dispatch:
    inputs:
      source:
        description: '镜像源 (Registry)'     
        required: true
        default: 'docker.io'
      destination:
        description: '目标源 (Registry)'
        required: true
        default: 'registry.cn-hangzhou.aliyuncs.com'
      source_repo:
        description: '仓库及标签 (格式 repo:tag)'
        required: true
        default: ''
      destination_repo:
        description: '目标仓库及标签 (格式 repo:tag)'
        required: true
        default: ''

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
    - name: Copy Docker Images
      run: |
        # 使用 skopeo 复制镜像，强制使用 v2s2 格式以兼容阿里云 ACR
        skopeo copy \
          --src-creds="${{ secrets.SOURCE_CREDENTIAL }}" \
          --dest-creds="${{ secrets.DESTINATION_CREDENTIAL }}" \
          --format v2s2 \
          --all \
          docker://${{ github.event.inputs.source }}/${{ github.event.inputs.source_repo }} \
          docker://${{ github.event.inputs.destination }}/${{ github.event.inputs.destination_repo }}
